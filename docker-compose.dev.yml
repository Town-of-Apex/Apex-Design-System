# =============================================================================
# LOCAL DEVELOPMENT — Docker Compose project: apex-dev
# =============================================================================
#
# Mode A — Recommended (host backend + Vite, hot reload):
#   .\run_dev.ps1          (Windows)
#   ./run_dev.sh           (macOS / Linux)
#   Starts only apex-dev-db; uvicorn and npm run dev run on the host.
#   Requires POSTGRES_HOST=127.0.0.1 in .env
#
# Mode B — Full stack in containers:
#   docker compose -f docker-compose.dev.yml up --build
#   Postgres hostname inside the stack: apex-dev-db (set on apex-backend service)
#
# DB reset (host tools): .\scripts\reset_dev_db.ps1
# =============================================================================

name: apex-dev

services:
  apex-dev-db:
    image: postgres:16-alpine
    container_name: apex-dev-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apex-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-demo} -d $${POSTGRES_DB:-demo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dev

  apex-backend:
    container_name: apex-dev-backend
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEV_MODE: "true"
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS: "true"
      AUTO_MIGRATE_DEV: "true"
      ALLOW_SQLITE_FALLBACK: "true"
      BASE_PATH: ""
      POSTGRES_HOST: apex-dev-db
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      apex-dev-db:
        condition: service_healthy
    networks:
      - dev

  apex-frontend:
    container_name: apex-dev-frontend
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BASE_PATH: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - apex-backend
    networks:
      - dev

networks:
  dev:

volumes:
  apex-dev-db-data:
