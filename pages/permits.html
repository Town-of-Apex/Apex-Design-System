<!-- PERMITS PAGE -->

<div class="app-container">

    <!-- PAGE HEADER -->
    <section class="stack">
        <p class="metadata">Applications</p>
        <h1 class="mt-2">Permit Applications</h1>
        <p class="body-text mt-4">Submit, search, and manage permit records.</p>
    </section>

    <hr style="border: 0; border-top: 1px solid var(--border-subtle);">

    <!-- TOOLBAR -->
    <section class="stack">
        <div class="cluster" style="--gutter: var(--space-3); align-items: stretch;">
            <input
                id="permit-search"
                type="search"
                placeholder="Search by name, address, or permit #..."
                oninput="Permits.debounceSearch()"
                style="flex: 1; min-width: 200px;"
            >
            <select id="permit-status-filter" onchange="Permits.load()" style="min-width: 160px;">
                <option value="">All Statuses</option>
                <option value="Submitted">Submitted</option>
                <option value="Under Review">Under Review</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Closed">Closed</option>
            </select>
            <button class="btn btn-primary" onclick="Permits.openCreate()">
                <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Permit
            </button>
        </div>
    </section>

    <!-- PERMITS TABLE -->
    <section class="stack mt-6">
        <div id="permits-table-wrapper" class="card" style="padding: 0; overflow-x: auto;">
            <table id="permits-table" style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border-subtle); background: var(--bg-canvas);">
                        <th class="permits-th">Permit #</th>
                        <th class="permits-th">Applicant</th>
                        <th class="permits-th">Address</th>
                        <th class="permits-th">Type</th>
                        <th class="permits-th">Status</th>
                        <th class="permits-th">Submitted</th>
                        <th class="permits-th" style="text-align: right;"></th>
                    </tr>
                </thead>
                <tbody id="permits-tbody">
                    <tr>
                        <td colspan="7" style="padding: var(--space-10); text-align: center;">
                            <p class="metadata">Loading...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

<!-- PERMIT FORM MODAL -->
<!-- Note: Uses the global modal infrastructure from core.html + apex-core.js for -->
<!-- confirmation dialogs and toasts. This is a second modal for the data entry form. -->
<div id="permit-form-overlay" class="modal-overlay" onclick="Permits.closeForm(event)">
    <div class="modal-card" style="max-width: 600px; width: 100%;" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 class="title-ui" id="permit-form-title">New Permit Application</h3>
        </div>
        <div class="modal-body">
            <form id="permit-form" onsubmit="Permits.submitForm(event)">
                <div class="stack" style="--gutter: var(--space-5);">

                    <div class="cluster" style="--gutter: var(--space-4); align-items: flex-start;">
                        <div class="stack" style="flex: 1; --gutter: var(--space-2);">
                            <label class="label" for="f-name">Applicant Name *</label>
                            <input id="f-name" type="text" placeholder="Full name" required>
                        </div>
                        <div class="stack" style="flex: 1; --gutter: var(--space-2);">
                            <label class="label" for="f-email">Applicant Email</label>
                            <input id="f-email" type="email" placeholder="email@example.com">
                        </div>
                    </div>

                    <div class="stack" style="--gutter: var(--space-2);">
                        <label class="label" for="f-address">Project Address *</label>
                        <input id="f-address" type="text" placeholder="123 Main St, Apex, NC" required>
                    </div>

                    <div class="cluster" style="--gutter: var(--space-4); align-items: flex-start;">
                        <div class="stack" style="flex: 1; --gutter: var(--space-2);">
                            <label class="label" for="f-type">Permit Type *</label>
                            <select id="f-type" required>
                                <option value="" disabled selected>Select type...</option>
                                <option value="Building">Building</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Grading">Grading</option>
                                <option value="Sign">Sign</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="stack" style="flex: 1; --gutter: var(--space-2);" id="f-status-group">
                            <label class="label" for="f-status">Status</label>
                            <select id="f-status">
                                <option value="Submitted">Submitted</option>
                                <option value="Under Review">Under Review</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                    </div>

                    <div class="stack" style="--gutter: var(--space-2);">
                        <label class="label" for="f-description">Description of Work *</label>
                        <textarea id="f-description" rows="4" placeholder="Describe the scope of work..." required></textarea>
                    </div>

                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" onclick="Permits.closeForm()">Cancel</button>
            <button class="btn btn-primary" type="submit" form="permit-form" id="permit-form-submit">Submit Permit</button>
        </div>
    </div>
</div>
