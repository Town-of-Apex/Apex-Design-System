services:
  apex-demo:
    container_name: apex-demo
    build: .
    restart: unless-stopped
    environment:
      - BASE_PATH=/demo
      - DATABASE_URL=sqlite:///./data/app.db
    volumes:
      # Persist the SQLite database across container restarts.
      # Switch to a postgres service + connection string to upgrade later.
      - apex-demo-data:/app/data
    networks:
      - apex-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apex-demo.rule=PathPrefix(`/demo`)"
      - "traefik.http.routers.apex-demo.entrypoints=web"
      - "traefik.http.services.apex-demo.loadbalancer.server.port=8080"
      - "traefik.docker.network=apex-internal"
    ports:
      - "8082:8082" # Exposed for local testing; remove in pure platform mode

volumes:
  apex-demo-data:

networks:
  apex-internal:
    external: true
