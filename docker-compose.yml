# Production — backend + frontend only (no local Postgres).
# Connects to the shared PostgreSQL container (postgres_db) on apex-internal.
#
#   docker compose up -d --build
#
# Local development uses docker-compose.dev.yml instead.
# Set POSTGRES_HOST=postgres_db and app credentials in .env before deploying.

services:
  apex-backend:
    container_name: apex-backend
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEV_MODE: "false"
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS: "true"
      AUTO_MIGRATE_DEV: "false"
      ALLOW_SQLITE_FALLBACK: "false"
    volumes:
      - apex-demo-data:/app/data
    networks:
      - apex-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apex-backend.rule=PathPrefix(`/demo/api`) || Path(`/demo/app_metadata.json`)"
      - "traefik.http.routers.apex-backend.entrypoints=web"
      - "traefik.http.services.apex-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=apex-internal"
    ports:
      - "8080:8080"

  apex-frontend:
    container_name: apex-frontend
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - apex-internal
    environment:
      CHOKIDAR_USEPOLLING: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apex-frontend.rule=PathPrefix(`/demo`)"
      - "traefik.http.routers.apex-frontend.entrypoints=web"
      - "traefik.http.services.apex-frontend.loadbalancer.server.port=5173"
      - "traefik.docker.network=apex-internal"
    ports:
      - "5173:5173"

volumes:
  apex-demo-data:

networks:
  apex-internal:
    external: true
