# =============================================================================
# PRODUCTION / STAGING — Docker Compose project: apex-prod
# =============================================================================
#
# Org-specific deployment (Traefik, external apex-internal network, shared
# postgres_db). Not intended for everyday local dev — use docker-compose.dev.yml
# and run_dev.ps1 / run_dev.sh instead.
#
# Before deploy:
#   - Set POSTGRES_HOST=postgres_db and production credentials in .env
#   - Ensure external network exists: docker network create apex-internal
#
#   docker compose up -d --build
#
# Note: frontend image still runs Vite dev server (production static build TBD).
# =============================================================================

name: apex-prod

services:
  apex-backend:
    container_name: apex-prod-backend
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEV_MODE: "false"
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS: "true"
      AUTO_MIGRATE_DEV: "false"
      ALLOW_SQLITE_FALLBACK: "false"
    volumes:
      - apex-prod-data:/app/data
    networks:
      - apex-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apex-backend.rule=PathPrefix(`/demo/api`) || Path(`/demo/app_metadata.json`)"
      - "traefik.http.routers.apex-backend.entrypoints=web"
      - "traefik.http.services.apex-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=apex-internal"
    ports:
      - "8080:8080"

  apex-frontend:
    container_name: apex-prod-frontend
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - apex-internal
    environment:
      CHOKIDAR_USEPOLLING: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apex-frontend.rule=PathPrefix(`/demo`)"
      - "traefik.http.routers.apex-frontend.entrypoints=web"
      - "traefik.http.services.apex-frontend.loadbalancer.server.port=5173"
      - "traefik.docker.network=apex-internal"
    ports:
      - "5173:5173"

volumes:
  apex-prod-data:

networks:
  apex-internal:
    external: true
